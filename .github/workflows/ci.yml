name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-test.txt
      - name: Tests (SQLite)
        run: python -m pytest -q

  postgres-migrate:
    # Tests run on SQLite with --nomigrations, so this is the only place
    # the real migrations meet Postgres before they reach Railway.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: finance_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/finance_ci
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-0123456789
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-0123456789
      ENCRYPTION_KEY: ci-only-encryption-key-not-used-anywhere-0123
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - name: Model changes must have a migration
        run: python manage.py makemigrations --check --dry-run
      - name: Deploy settings check (report only)
        run: python manage.py check --deploy
        continue-on-error: true

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
